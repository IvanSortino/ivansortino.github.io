  </g>
  <g fill="#FFFFFF">
    <rect x="32" y="32" width="12" height="12" rx="3"/>
    <rect x="32" y="48" width="12" height="12" rx="3"/>
    <rect x="32" y="64" width="12" height="12" rx="3"/>
    <rect x="48" y="48" width="12" height="12" rx="3"/>
    <rect x="64" y="32" width="12" height="12" rx="3"/>
    <rect x="64" y="64" width="12" height="12" rx="3"/>
